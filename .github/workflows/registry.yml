name: MCP Registry
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    # The registry checks that the PyPI README carries server.json's mcp-name, so run after PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: >
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
