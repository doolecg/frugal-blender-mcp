name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.13"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Tag must match the package and registry versions
        run: |
          test "v$(uv version --short)" = "$GITHUB_REF_NAME"
          test "$(jq -r '.version, .packages[0].version' server.json | sort -u)" = "$(uv version --short)"
      - run: uv build
      - run: uv run python scripts/package_addon.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --generate-notes dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS
  pypi:
    # Requires a PyPI trusted publisher for this repository, workflow and environment.
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.13"
      - run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
